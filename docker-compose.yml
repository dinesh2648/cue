# One-command launch:  ./scripts/setup.sh   (or: docker compose up -d --build)
# Config comes from .env (copy from .env.example). Runs zero-cred by default; fill .env
# to enable Claude, billing, SSO, connectors. Postgres/Qdrant/Redis: docker compose --profile full up -d
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["${BACKEND_PORT:-8000}:8000"]
    # Lets the container reach a Postgres running on the VM host via host.docker.internal
    # (only used if DATABASE_URL points there instead of the compose `postgres` service).
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/copilot.db}
      ENABLED_PACKS: ${ENABLED_PACKS:-sales}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      RECALL_API_KEY: ${RECALL_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes: ["backenddata:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16
    profiles: ["full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    # Host publish is only for reaching the DB from the VM host; the backend talks to it over
    # the internal network as `postgres:5432`. Override POSTGRES_PORT if 5432 is taken on the host.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full"]
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    restart: unless-stopped
    ports: ["6379:6379"]

volumes:
  backenddata:
  pgdata:
  qdrantdata:
