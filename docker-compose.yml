# One-command launch:  ./scripts/setup.sh   (or: docker compose up -d --build)
# Config comes from .env (copy from .env.example). Runs zero-cred by default; fill .env
# to enable Claude, billing, SSO, connectors.
# Postgres (the DB):       docker compose --profile full up -d --build
# Optional Qdrant + Redis: add  --profile extras   (the app runs fine without them)
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["${BACKEND_PORT:-8000}:8000"]
    # Lets the container reach a Postgres running on the VM host via host.docker.internal
    # (only used if DATABASE_URL points there instead of the compose `postgres` service).
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/copilot.db}
      ENABLED_PACKS: ${ENABLED_PACKS:-sales}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}       # deep answers/prep/summary — override in .env
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-haiku-4-5-20251001}     # fast intent triage — override in .env
      # Default 'auto' → messages_mcp when an Anthropic key is set. Must never be empty: an empty
      # string is treated as an explicit engine and would disable the deep tier. .env is NOT baked
      # into the image, so this passthrough is the only way the setting reaches the container.
      AGENT_ENGINE: ${AGENT_ENGINE:-auto}
      # Cost control: cap the live-answer MCP tool surface to read/search tools (default on).
      # OVERRIDES is JSON to retune per provider; empty is safe (parsed defensively → no overrides).
      MCP_TOOL_ALLOWLIST: ${MCP_TOOL_ALLOWLIST:-true}
      MCP_TOOL_ALLOWLIST_OVERRIDES: ${MCP_TOOL_ALLOWLIST_OVERRIDES:-}
      # Prompt caching: cache the stable system(+tools) prefix so it's re-read at ~0.1x (default on).
      PROMPT_CACHE: ${PROMPT_CACHE:-true}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}   # stable session JWT signing across restarts
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      RECALL_API_KEY: ${RECALL_API_KEY:-}
      RECALL_REGION: ${RECALL_REGION:-}
      RECALL_PUBLIC_URL: ${RECALL_PUBLIC_URL:-}
      RECALL_TREAT_ALL_AS_CUSTOMER: ${RECALL_TREAT_ALL_AS_CUSTOMER:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes: ["backenddata:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}   # e.g. /cue when hosting under a sub-path
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    # next start re-reads next.config.mjs at runtime; basePath must match the build arg above.
    environment:
      NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16
    profiles: ["full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    # Host publish is only for reaching the DB from the VM host; the backend talks to it over
    # the internal network as `postgres:5432`. Override POSTGRES_PORT if 5432 is taken on the host.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional infra — the app runs without these (TF-IDF retrieval + in-process realtime).
  # Only started with `--profile extras`; set QDRANT_URL / REDIS_URL to actually use them.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["extras"]
    restart: unless-stopped
    ports: ["${QDRANT_PORT:-6333}:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  redis:
    image: redis:7-alpine
    profiles: ["extras"]
    restart: unless-stopped
    ports: ["${REDIS_PORT:-6379}:6379"]

volumes:
  backenddata:
  pgdata:
  qdrantdata:
