# Cue under a sub-path — e.g. https://test-hrms.setupinsaudi.com/cue
#
# Paste these `location` blocks INSIDE your existing HTTPS server block for
# test-hrms.setupinsaudi.com (the one with `listen 443 ssl; server_name test-hrms...;`).
# Cue's containers listen on the host as backend :8000 and frontend :3000.
#
# Routing:
#   /cue/api/  → backend  /api/    (REST; /cue is stripped)
#   /cue/ws/   → backend  /ws/     (WebSocket live transcript)
#   /cue/health, /cue/metrics → backend
#   /cue/      → frontend          (Next.js built with basePath=/cue; /cue preserved)
#
# Requires in the root .env (then rebuild — NEXT_PUBLIC_* are inlined at build time):
#   BASE_PATH=/cue
#   PUBLIC_API_URL=https://test-hrms.setupinsaudi.com/cue
#   APP_BASE_URL=https://test-hrms.setupinsaudi.com/cue
#   FRONTEND_URL=https://test-hrms.setupinsaudi.com/cue
#   CORS_ORIGINS=https://test-hrms.setupinsaudi.com
#   RECALL_PUBLIC_URL=https://test-hrms.setupinsaudi.com/cue   # only if using Recall live bots

    client_max_body_size 25m;

    # Bare /cue → /cue/
    location = /cue { return 308 /cue/; }

    # WebSocket (live transcript). Must come before /cue/ and /cue/api/.
    location /cue/ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # Backend REST API
    location /cue/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;    # deep agentic answers can take a while
    }

    # Backend health + metrics (exact paths)
    location = /cue/health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /cue/metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js, basePath=/cue). No URI on proxy_pass → the /cue/... path is
    # preserved, which is exactly what Next expects when built with basePath=/cue.
    location /cue/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
